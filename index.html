<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift For You ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Animated Background -->
<div class="background"></div>
<div id="hearts"></div>

<!-- Countdown Screen -->
<div class="container" id="countdownScreen">

    <h1 class="title">🎁 A Special Gift</h1>

    <p class="subtitle">
        Someone made something very special for you...
    </p>

    <!-- Gift -->
    <div class="gift-area">

        <div class="gift" id="gift">
            🎁
        </div>

        <div class="lock">
            🔒
        </div>

    </div>

    <h3>Unlocks On</h3>

    <h2 class="date">
        29 JULY ❤️
    </h2>

    <!-- Countdown -->

    <div class="countdown">

        <div class="time">

            <span id="days">00</span>

            <small>Days</small>

        </div>

        <div class="time">

            <span id="hours">00</span>

            <small>Hours</small>

        </div>

        <div class="time">

            <span id="minutes">00</span>

            <small>Minutes</small>

        </div>

        <div class="time">

            <span id="seconds">00</span>

            <small>Seconds</small>

        </div>

    </div>

    <button id="openBtn">

        ❤️ Open My Gift ❤️

    </button>

    <p id="message">

        Waiting for your birthday...

    </p>

</div>

<!-- Birthday Screen -->

<section id="birthdayScreen">

    <div class="birthdayCard">

        <h1>

            🎉 Happy Birthday ❤️

        </h1>

        <h2>

            HEY LOVE 🥹💕

        </h2>

        <div id="typing">

        </div>

        <button id="continueBtn">

            ❤️ Continue ❤️

        </button>

    </div>

</section>

<!-- Music -->
<audio id="music" loop>
    <source src="./Christina_Perri_-_Thousand_years_(mp3.pm).mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
